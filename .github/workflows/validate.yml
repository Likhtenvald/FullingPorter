name: Build validation
on:
  pull_request:
  push:
    branches: [develop]
jobs:
  source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required project files
        run: |
          test -f FullingPorter.csproj
          test -f manifest.json
          test -f src/Plugin.cs
          test -f src/Porter/PorterWorker.cs
          test -f src/Storage/QuickStackPlusBridge.cs
      - name: Verify release version alignment
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          plugin = pathlib.Path("src/Plugin.cs").read_text(encoding="utf-8")
          match = re.search(r'public const string PluginVersion\s*=\s*"([^"]+)"', plugin)
          if match is None:
              raise SystemExit("PluginVersion was not found")
          versions = {
              "plugin": match.group(1),
              "project": ET.parse("FullingPorter.csproj").findtext(".//Version"),
              "manifest": json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))["version_number"],
          }
          if len(set(versions.values())) != 1 or re.fullmatch(r"\d+\.\d+\.\d+", match.group(1)) is None:
              raise SystemExit(f"Release versions must match and use major.minor.patch: {versions}")
          print(f"FullingPorter version: {match.group(1)}")
          PY
      - name: Validate Thunderstore package assets
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import struct

          files = ["packaging/README.md", "packaging/CHANGELOG.md", "packaging/icon.png", "scripts/package-thunderstore.ps1"]
          for filename in files:
              if not pathlib.Path(filename).is_file() or not pathlib.Path(filename).stat().st_size:
                  raise SystemExit(f"Missing package asset: {filename}")
          icon = pathlib.Path("packaging/icon.png").read_bytes()
          if icon[:16] != b"\x89PNG\r\n\x1a\n\x00\x00\x00\x0dIHDR" or struct.unpack(">II", icon[16:24]) != (256, 256):
              raise SystemExit("Thunderstore icon must be a 256x256 PNG")
          manifest = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))
          if len(manifest["description"]) > 250 or not manifest["dependencies"]:
              raise SystemExit("Invalid Thunderstore manifest metadata")
          print("Thunderstore package assets valid")
          PY
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run unit tests
        working-directory: tests/FullingPorter.Tests
        run: dotnet test FullingPorter.Tests.csproj --configuration Release
      - name: Note
        run: echo "Full mod compile still requires Valheim/BepInEx/Jotunn assemblies and is performed in the local playtest environment."
